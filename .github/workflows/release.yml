name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Run tests
        run: go test ./...

  create-release:
    name: Create release
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            artifact: Meow-Politics-Helper-windows-amd64.exe
          - goos: windows
            goarch: arm64
            artifact: Meow-Politics-Helper-windows-arm64.exe
          - goos: linux
            goarch: amd64
            artifact: Meow-Politics-Helper-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: Meow-Politics-Helper-linux-arm64
          - goos: darwin
            goarch: amd64
            artifact: Meow-Politics-Helper-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: Meow-Politics-Helper-darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.artifact }}" .

      # 非 Windows 平台打包成 zip：保留可执行权限，避免浏览器下载丢失 +x 导致无法直接运行
      - name: Package binary (unix)
        if: matrix.goos != 'windows'
        run: |
          set -euo pipefail
          cd dist
          zip "${{ matrix.artifact }}.zip" "${{ matrix.artifact }}"
          rm "${{ matrix.artifact }}"

      - name: Upload asset to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ASSET="dist/${{ matrix.artifact }}"
          else
            ASSET="dist/${{ matrix.artifact }}.zip"
          fi
          gh release upload "$RELEASE_TAG" "$ASSET" --clobber
